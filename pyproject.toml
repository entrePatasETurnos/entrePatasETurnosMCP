[project]
name = "entrepataseturnos-mcp"
version = "0.1.0"
description = "MCP server exposing approved EntrePatasETurnos workflows through the EntrePatasETurnos API"
readme = "README.md"
authors = [
    { name = "Eduardo de Moura Rodrigues", email = "eduardom.rodrigues@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50",
    "httpx>=0.28",
    "mcp>=2.3,<3",
    "pydantic>=2.12",
    "pydantic-settings>=2.16",
    "redis>=8.1",
    "uvicorn>=0.54",
]

[project.scripts]
entrepataseturnos-mcp = "entrepataseturnos_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.40",
    "mypy>=2.4.1",
    "pytest>=9",
    "respx>=0.23",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["anyio: run test with anyio"]
